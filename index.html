<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universe to Study — Aplicando mejoras</title>
<meta name="description" content="Universe to Study está aplicando mejoras. Volvemos pronto.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/home-access/universe-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#06070b;color:#f4f5f8;
  font-family:Manrope,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;
  -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:32px}
/* Un fondo que respira: el mismo cielo del sitio, sin cargar nada. */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1px 1px at 18% 24%,#ffffff55,transparent),
    radial-gradient(1px 1px at 72% 18%,#ffffff44,transparent),
    radial-gradient(1px 1px at 42% 62%,#ffffff3a,transparent),
    radial-gradient(1px 1px at 86% 74%,#ffffff33,transparent),
    radial-gradient(1px 1px at 28% 84%,#ffffff2e,transparent),
    radial-gradient(60% 45% at 62% 38%,#141a2e88,transparent 70%)}
main{position:relative;z-index:1;width:min(560px,100%);text-align:center}
.brand{display:flex;justify-content:center;align-items:center;gap:11px;margin-bottom:46px}
.brand svg{width:30px;height:30px}
.brand span{font-size:21px;font-weight:300;letter-spacing:-.6px}
.brand small{display:block;font-size:8px;letter-spacing:.34em;color:#9ea1b2;margin-top:3px}
.eyebrow{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:#8fb0ff;margin-bottom:20px}
h1{font-size:clamp(30px,6vw,46px);font-weight:400;letter-spacing:-2px;line-height:1.12;margin:0 0 20px}
p{color:#9ea1b2;font-size:13px;line-height:1.9;margin:0 auto;max-width:44ch}
.rule{height:1px;background:linear-gradient(90deg,transparent,#ffffff1f,transparent);margin:42px 0}
.foot{color:#70737f;font-size:10px;letter-spacing:.05em}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8fb0ff;
  margin-right:8px;vertical-align:middle;animation:p 2.4s cubic-bezier(.23,1,.32,1) infinite}
@keyframes p{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.8}}
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 3v10a7 7 0 0 0 14 0V3" stroke="#f4f5f8" stroke-width="2.1" stroke-linecap="round"/></svg>
    <span>universe<small>TO STUDY</small></span>
  </div>
  <span class="eyebrow"><span class="pulse"></span>Aplicando mejoras</span>
  <h1>Estamos mejorando<br>Universe.</h1>
  <p>Estamos aplicando mejoras en la plataforma. Las herramientas —temario, biblioteca, clases, planificador y el resto— volverán a estar disponibles en cuanto terminemos.</p>
  <div class="rule"></div>
  <p class="foot">Universe to Study · Aprende. Practica. Avanza.</p>
</main>
</body>
</html>
