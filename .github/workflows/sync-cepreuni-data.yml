name: Sincronizar datos CEPREUNI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-cepreuni-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recibir y validar publicaciones oficiales
        run: node tools/sync-cepreuni-publications.mjs
      - name: Publicar solo si existen cambios
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all data/cepreuni)" ]; then
            echo "No hay datos nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cepre-2026-2-official.js data/cepreuni
          git commit -m "Actualizar datos oficiales CEPREUNI"
          git push
