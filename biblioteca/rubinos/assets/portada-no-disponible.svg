    <text x="350" y="622" font-size="43" font-weight="700" letter-spacing="2">ENCICLOPEDIA</text>
    <text x="350" y="740" font-size="88" font-weight="700" fill="#f1c942">2012</text>
    <text x="350" y="820" font-size="17" letter-spacing="3">VISTA PREVIA NO DISPONIBLE</text>
  </g>
