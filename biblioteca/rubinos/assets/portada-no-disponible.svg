      <stop offset="0" stop-color="#09241f"/>
      <stop offset="1" stop-color="#123a31"/>
    </linearGradient>
    <pattern id="rays" width="110" height="110" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0h12v110H0z" fill="#f1c942" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="700" height="1000" fill="#b91028"/>
  <rect x="16" y="16" width="668" height="968" fill="#09241f"/>
  <rect x="35" y="35" width="630" height="930" fill="#f5efcf"/>
  <rect x="53" y="53" width="594" height="894" fill="url(#paper)"/>
