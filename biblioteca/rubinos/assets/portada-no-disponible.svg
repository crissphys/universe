<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" role="img" aria-labelledby="title desc">
  <title id="title">Rubiños Ediciones · La Enciclopedia 2012</title>
  <desc id="desc">Portada editorial de respaldo para los libros de la colección.</desc>
  <defs>
